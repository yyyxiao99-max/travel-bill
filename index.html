<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>出行分账计算器</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #245E43;
            --primary-hover: #1D4F38;
            --accent: #2F8157;
            --primary-light: #DFF1E6;
            --bg: #F4F8F5;
            --card: #FFFFFF;
            --text: #173225;
            --text-light: #789083;
            --border: #DCE8E0;
            --danger: #D94B4B;
            --danger-light: #FCEBEA;
            --warning: #B87418;
            --warning-light: #FFF3DE;
            --shadow-sm: 0 4px 14px rgba(23, 50, 37, 0.06);
            --shadow-md: 0 12px 32px rgba(23, 50, 37, 0.10);
            --radius-card: 18px;
            --radius-control: 13px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: var(--bg); -webkit-text-size-adjust: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background:
                radial-gradient(circle at 90% 0%, rgba(120, 181, 145, 0.16), transparent 28rem),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        button, input, select, textarea { font: inherit; }
        button { -webkit-tap-highlight-color: transparent; }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 3px solid rgba(47, 129, 87, 0.22);
            outline-offset: 2px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: calc(18px + env(safe-area-inset-top)) 18px 14px;
            background: rgba(244, 248, 245, 0.88);
            border-bottom: 1px solid rgba(220, 232, 224, 0.75);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .header h1 {
            max-width: 600px;
            margin: 0 auto;
            color: var(--text);
            font-size: clamp(20px, 5.6vw, 24px);
            font-weight: 700;
            letter-spacing: -0.02em;
            overflow-wrap: anywhere;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            min-height: 44px;
            max-width: 600px;
            margin: -8px auto 2px;
            color: var(--accent);
            background: none;
            border: 0;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 18px;
        }

        .card {
            position: relative;
            background: var(--card);
            border: 1px solid rgba(220, 232, 224, 0.75);
            border-radius: var(--radius-card);
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-sm);
        }

        .card-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: var(--text);
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 48px;
            margin-bottom: 9px;
            padding: 12px 18px;
            border: 1px solid transparent;
            border-radius: var(--radius-control);
            cursor: pointer;
            font-size: 15px;
            font-weight: 650;
            text-align: center;
            transition: transform .16s ease, background-color .16s ease, box-shadow .16s ease;
        }

        .btn:active { transform: scale(0.985); }
        .btn-primary { color: #fff; background: var(--primary); box-shadow: 0 8px 18px rgba(36, 94, 67, 0.18); }
        .btn-primary:active { background: var(--primary-hover); }
        .btn-secondary { color: var(--primary); background: var(--primary-light); }
        .btn-danger { color: var(--danger); background: var(--danger-light); }
        .btn-small { width: auto; min-height: 40px; margin: 0; padding: 8px 12px; font-size: 13px; }

        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-size: 13px;
            font-weight: 650;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            color: var(--text);
            background: #FBFDFC;
            border: 1px solid var(--border);
            border-radius: var(--radius-control);
            font-size: 16px;
            transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
        }

        .input-group input::placeholder, .input-group textarea::placeholder { color: #9AAEA2; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            outline: none;
            background: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(47, 129, 87, 0.12);
        }

        .member-tags { display: flex; flex-wrap: wrap; gap: 9px; margin-bottom: 16px; }
        .member-tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 8px 14px;
            color: var(--accent);
            background: var(--primary-light);
            border: 1px solid transparent;
            border-radius: 999px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            user-select: none;
            transition: background .16s ease, color .16s ease, transform .16s ease;
        }
        .member-tag.selected { color: #fff; background: var(--primary); }
        .member-tag:active { transform: scale(.97); }

        .radio-group { display: flex; gap: 10px; margin-bottom: 18px; }
        .radio-option {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            min-height: 48px;
            padding: 10px;
            color: var(--text-light);
            background: #FBFDFC;
            border: 1px solid var(--border);
            border-radius: var(--radius-control);
            cursor: pointer;
            font-size: 14px;
            font-weight: 650;
            text-align: center;
            transition: all .16s ease;
        }
        .radio-option.active { color: var(--primary); background: var(--primary-light); border-color: rgba(47, 129, 87, .45); }

        .activity-item {
            position: relative;
            padding: 15px;
            margin-bottom: 10px;
            background: #FBFDFC;
            border: 1px solid var(--border);
            border-radius: 15px;
        }
        .activity-layout { display: flex; align-items: flex-start; gap: 12px; }
        .activity-icon {
            display: grid;
            place-items: center;
            flex: 0 0 42px;
            width: 42px;
            height: 42px;
            color: var(--accent);
            background: var(--primary-light);
            border-radius: 13px;
        }
        .activity-content { flex: 1; min-width: 0; }
        .ui-icon { width: 18px; height: 18px; flex: 0 0 auto; }
        .modal-close .ui-icon { width: 21px; height: 21px; }
        .activity-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
        .activity-name { min-width: 0; color: var(--text); font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
        .activity-amount { flex-shrink: 0; color: var(--primary); font-size: 16px; font-weight: 750; font-variant-numeric: tabular-nums; }
        .activity-detail { color: var(--text-light); font-size: 12px; line-height: 1.6; margin-bottom: 6px; overflow-wrap: anywhere; }
        .activity-images { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 8px; margin-top: 11px; }
        .activity-images img { width: 100%; aspect-ratio: 1; max-width: 96px; height: auto; object-fit: cover; border-radius: 11px; cursor: pointer; }
        .activity-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 11px; }
        .btn-edit, .btn-delete {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 40px;
            padding: 8px 12px;
            border: 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 650;
        }
        .btn-edit { color: var(--warning); background: var(--warning-light); }
        .btn-delete { color: var(--danger); background: var(--danger-light); }

        .settlement {
            padding: 20px;
            margin-bottom: 16px;
            color: #fff;
            background: linear-gradient(145deg, #245E43 0%, #337B59 100%);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-md);
        }
        .settlement-title { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; font-size: 15px; font-weight: 650; opacity: .82; }
        .settlement-total { margin-bottom: 18px; font-size: clamp(28px, 9vw, 36px); font-weight: 750; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
        .settlement-person {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            padding: 11px 12px;
            margin-bottom: 8px;
            background: rgba(255,255,255,.13);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 12px;
        }
        .settlement-person-name { min-width: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
        .settlement-person-amount { flex-shrink: 0; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

        .image-upload { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; margin-top: 10px; }
        .image-preview-wrapper { position: relative; min-width: 0; }
        .image-preview { display: block; width: 100%; max-width: 100px; aspect-ratio: 1; height: auto; object-fit: cover; border-radius: 12px; }
        .image-remove {
            position: absolute;
            top: -7px;
            right: -7px;
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            color: #fff;
            background: var(--danger);
            border: 3px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            font-size: 11px;
        }
        .delete-btn { min-height: 40px; padding: 8px 10px; color: var(--danger); background: transparent; border: 0; border-radius: 10px; cursor: pointer; }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            justify-content: center;
            align-items: flex-end;
            padding-top: max(24px, env(safe-area-inset-top));
            background: rgba(18, 35, 26, .46);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal-content {
            width: 100%;
            max-width: 600px;
            max-height: calc(92vh - env(safe-area-inset-top));
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 22px 18px calc(18px + env(safe-area-inset-bottom));
            background: var(--card);
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -14px 40px rgba(23, 50, 37, .16);
        }
        .modal-content::before {
            content: "";
            display: block;
            width: 38px;
            height: 4px;
            margin: -8px auto 15px;
            background: var(--border);
            border-radius: 999px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
        .modal-header h2 { font-size: 19px; font-weight: 750; }
        .modal-close {
            display: grid;
            place-items: center;
            width: 44px;
            height: 44px;
            margin: -10px -8px -10px 0;
            color: var(--text-light);
            background: transparent;
            border: 0;
            border-radius: 50%;
            cursor: pointer;
            font-size: 22px;
        }

        .empty-state { padding: 46px 20px; color: var(--text-light); text-align: center; line-height: 1.7; }
        .empty-state-icon { margin-bottom: 12px; font-size: 42px; }
        .empty-state-icon .ui-icon { width: 42px; height: 42px; }
        .loading { padding: 30px 20px; color: var(--text-light); text-align: center; }
        .project-summary {
            display: grid;
            grid-template-columns: 1.4fr 1fr 1fr;
            gap: 10px;
            padding: 18px;
            margin-bottom: 14px;
            color: #fff;
            background: linear-gradient(145deg, #245E43 0%, #337B59 100%);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-md);
        }
        .summary-cell { min-width: 0; }
        .summary-label { display: block; margin-bottom: 5px; font-size: 11px; opacity: .72; }
        .summary-value { display: block; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
        .summary-cell:first-child .summary-value { font-size: clamp(21px, 7vw, 28px); letter-spacing: -.03em; }

        @media (max-width: 360px) {
            .container { padding: 14px; }
            .card { padding: 15px; }
            .header { padding-left: 14px; padding-right: 14px; }
            .settlement-total { font-size: 27px; }
            .radio-group { gap: 7px; }
        }

        @media (min-width: 601px) {
            .header { padding-top: 20px; }
            .container { padding: 24px 0; }
            .modal { align-items: center; padding: 30px; }
            .modal-content { width: min(500px, 100%); max-height: 84vh; padding: 24px; border-radius: 22px; }
            .modal-content::before { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="homePage">
            <div class="header">
                <h1>出行分账计算器</h1>
            </div>
            <div class="container">
                <button class="btn btn-primary" onclick="showCreateProject()">＋ 新建项目</button>
                <div id="projectList"><div class="loading">加载中...</div></div>
            </div>
        </div>

        <div id="projectPage" style="display:none;">
            <div class="header">
                <button class="back-btn" onclick="backToHome()" aria-label="返回项目列表"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>返回</button>
                <h1 id="projectTitle"></h1>
            </div>
            <div class="container">
                <div class="project-summary" id="projectSummary" aria-label="项目概览"></div>
                <div class="card">
                    <div class="card-title">
                        <span>项目成员</span>
                        <button class="btn btn-small btn-secondary" onclick="showEditMembers()">编辑成员</button>
                    </div>
                    <div class="member-tags" id="projectMembers"></div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <span>活动记录</span>
                        <button class="btn btn-small btn-primary" onclick="showAddActivity()">＋ 添加活动</button>
                    </div>
                    <div id="activityList"></div>
                </div>

                <div id="settlementArea"></div>

                <button class="btn btn-danger" onclick="deleteCurrentProject()">删除项目</button>
            </div>
        </div>
    </div>

    <div class="modal" id="createProjectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>新建项目</h2>
                <button class="modal-close" onclick="closeModal('createProjectModal')" aria-label="关闭"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="input-group">
                <label>项目名称</label>
                <input type="text" id="newProjectName" placeholder="例如：XXX旅游">
            </div>
            <div class="input-group">
                <label>成员（最多10人，用逗号分隔）</label>
                <input type="text" id="newProjectMembers" placeholder="例如：小明,小红,小刚">
            </div>
            <button class="btn btn-primary" onclick="createProject()">创建项目</button>
        </div>
    </div>

    <div class="modal" id="editMembersModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>编辑成员</h2>
                <button class="modal-close" onclick="closeModal('editMembersModal')" aria-label="关闭"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="input-group">
                <label>成员（用逗号分隔）</label>
                <input type="text" id="editMembersInput">
            </div>
            <button class="btn btn-primary" onclick="updateMembers()">保存</button>
        </div>
    </div>

    <div class="modal" id="addActivityModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="activityModalTitle">添加活动</h2>
                <button class="modal-close" onclick="closeModal('addActivityModal')" aria-label="关闭"><svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
            </div>
            <div class="input-group">
                <label>活动名称</label>
                <input type="text" id="activityName" placeholder="例如：吃饭">
            </div>
            <div class="input-group">
                <label>花费类型</label>
                <div class="radio-group">
                    <div class="radio-option active" id="typeAvg" onclick="selectType('avg')">平均花费</div>
                    <div class="radio-option" id="typeCustom" onclick="selectType('custom')">不平均花费</div>
                </div>
            </div>
            <div class="input-group">
                <label>参与成员</label>
                <div class="member-tags" id="activityMembers"></div>
            </div>
            <div id="avgInputArea">
                <div class="input-group">
                    <label>总花费（元）</label>
                    <input type="number" id="totalAmount" placeholder="0.00" step="0.01">
                </div>
            </div>
            <div id="customInputArea" style="display:none;">
                <div class="input-group">
                    <label>每人花费（元）</label>
                    <div id="customAmountInputs"></div>
                </div>
            </div>
            <div class="input-group">
                <label>上传图片（最多3张，自动压缩）</label>
                <input type="file" id="imageInput" accept="image/*" multiple style="display:block;margin-bottom:10px;" onchange="handleImageUpload(event)">
                <div class="image-upload" id="imageUploadArea"></div>
            </div>
            <button class="btn btn-primary" onclick="saveActivity()">保存活动</button>
        </div>
    </div>

    <script>
        // Firebase配置
        const firebaseConfig = {
            apiKey: "AIzaSyBbej2WflKtEaA980DouDe7Ddtt0f6YwBk",
            authDomain: "travel-bill-44019.firebaseapp.com",
            projectId: "travel-bill-44019",
            storageBucket: "travel-bill-44019.firebasestorage.app",
            messagingSenderId: "605023308270",
            appId: "1:605023308270:web:e6a4b18cbfb9253607a6ff"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        db.settings({
            experimentalForceLongPolling: true
        });

        let projects = [];
        let currentProjectId = null;
        let currentType = 'avg';
        let selectedMembers = [];
        let currentActivityImages = [];
        let editingActivityId = null;
        let unsubscribe = null;

        function icon(name) {
            const paths = {
                food: '<path d="M7 3v8M4.5 3v5.5A2.5 2.5 0 0 0 7 11v10M9.5 3v5.5A2.5 2.5 0 0 1 7 11M16 3v18M16 3c3 2 4 5 4 8h-4"/>',
                stay: '<path d="M3 20V9l9-6 9 6v11M7 20v-7h10v7M9 10h.01M15 10h.01"/>',
                transport: '<path d="M5 17h14M7 17l-2-5 2-5h10l2 5-2 5M8 20h.01M16 20h.01M6 12h12"/>',
                shopping: '<path d="M5 8h14l-1 13H6L5 8ZM9 10V7a3 3 0 0 1 6 0v3"/>',
                fun: '<path d="M12 3l2.6 5.3 5.9.9-4.3 4.2 1 5.9-5.2-2.8-5.2 2.8 1-5.9-4.3-4.2 5.9-.9L12 3Z"/>',
                receipt: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3ZM9 8h6M9 12h6M9 16h4"/>',
                edit: '<path d="M4 20h4l11-11-4-4L4 16v4ZM13.5 6.5l4 4"/>',
                trash: '<path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/>',
                diamond: '<path d="M3 9l4-5h10l4 5-9 12L3 9Zm0 0h18M8 4l4 17 4-17"/>'
            };
            const path = paths[name] || paths.receipt;
            return `<svg class="ui-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
        }

        function getActivityIcon(name) {
            const value = String(name || '').toLowerCase();
            const rules = [
                ['food', /饭|餐|吃|火锅|咖啡|奶茶|酒/],
                ['stay', /酒店|民宿|住宿|房|旅馆/],
                ['transport', /车|地铁|公交|打车|机票|飞机|高铁|火车|船/],
                ['shopping', /买|购物|商场|超市|礼物/],
                ['fun', /门票|景点|乐园|电影|唱歌|娱乐/]
            ];
            const match = rules.find(([, pattern]) => pattern.test(value));
            return icon(match ? match[0] : 'receipt');
        }

        function init() {
            loadProjects();
        }

        function loadProjects() {
            if (unsubscribe) {
                unsubscribe();
            }

            document.getElementById('projectList').innerHTML = '<div class="loading">正在连接云端数据...</div>';

            const query = db.collection('projects').orderBy('createdAt', 'desc');
            unsubscribe = query.onSnapshot({ includeMetadataChanges: true }, (snapshot) => {
                if (snapshot.empty && snapshot.metadata.fromCache) {
                    document.getElementById('projectList').innerHTML = '<div class="loading">正在连接云端数据...</div>';
                    return;
                }

                projects = [];
                snapshot.forEach((doc) => {
                    projects.push({ id: doc.id, ...doc.data() });
                });
                renderProjectList();
            }, (error) => {
                console.error('加载失败:', error);
                document.getElementById('projectList').innerHTML = `<div class="empty-state"><p>云端数据连接失败</p><p style="font-size:12px;margin-top:8px;">${error.message}</p></div>`;
            });
        }

        function renderProjectList() {
            const list = document.getElementById('projectList');
            if (projects.length === 0) {
                list.innerHTML = `<div class="empty-state"><div class="empty-state-icon">${icon('receipt')}</div><p>还没有项目，点击上方按钮创建吧！</p></div>`;
            } else {
                list.innerHTML = projects.map((project, index) => `
                    <div class="card" onclick="openProject('${project.id}')" style="cursor:pointer;">
                        <div class="activity-header">
                            <div class="activity-name">${project.name}</div>
                            <div class="activity-amount">¥${calculateTotal(project).toFixed(2)}</div>
                        </div>
                        <div class="activity-detail">${project.members.length}人 · ${project.activities.length}个活动</div>
                    </div>
                `).join('');
            }
        }

        function showCreateProject() {
            document.getElementById('newProjectName').value = '';
            document.getElementById('newProjectMembers').value = '';
            document.getElementById('createProjectModal').style.display = 'flex';
        }

        async function createProject() {
            const name = document.getElementById('newProjectName').value.trim();
            const membersStr = document.getElementById('newProjectMembers').value.trim();
            
            if (!name) {
                alert('请输入项目名称');
                return;
            }
            
            const members = membersStr.split(/[,，、\s]+/).filter(m => m);
            if (members.length < 2 || members.length > 10) {
                alert('成员数量需要在2-10人之间');
                return;
            }

            try {
                await db.collection('projects').add({
                    name: name,
                    members: members,
                    activities: [],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                closeModal('createProjectModal');
            } catch (error) {
                alert('创建失败：' + error.message);
            }
        }

        function openProject(projectId) {
            currentProjectId = projectId;
            document.getElementById('homePage').style.display = 'none';
            document.getElementById('projectPage').style.display = 'block';
            
            if (unsubscribe) {
                unsubscribe();
            }
            
            unsubscribe = db.collection('projects').doc(projectId).onSnapshot((doc) => {
                if (doc.exists) {
                    const project = { id: doc.id, ...doc.data() };
                    syncProjectCache(project);
                    document.getElementById('projectTitle').textContent = project.name;
                    renderProjectDetails(project);
                }
            });
        }

        function syncProjectCache(project) {
            const index = projects.findIndex(item => item.id === project.id);
            if (index === -1) {
                projects.push(project);
            } else {
                projects[index] = project;
            }
        }

        function backToHome() {
            if (unsubscribe) {
                unsubscribe();
            }
            document.getElementById('projectPage').style.display = 'none';
            document.getElementById('homePage').style.display = 'block';
            loadProjects();
        }

        function renderProjectDetails(project) {
            const total = calculateTotal(project);
            const memberCount = project.members.length;
            const average = memberCount ? total / memberCount : 0;
            document.getElementById('projectSummary').innerHTML = `
                <div class="summary-cell"><span class="summary-label">总支出</span><span class="summary-value">¥${total.toFixed(2)}</span></div>
                <div class="summary-cell"><span class="summary-label">活动</span><span class="summary-value">${(project.activities || []).length} 笔</span></div>
                <div class="summary-cell"><span class="summary-label">人均参考</span><span class="summary-value">¥${average.toFixed(2)}</span></div>
            `;
            document.getElementById('projectMembers').innerHTML = project.members.map(m => 
                `<span class="member-tag">${m}</span>`
            ).join('');
            
            renderActivities(project);
            renderSettlement(project);
        }

        function renderActivities(project) {
            const list = document.getElementById('activityList');
            
            if (!project.activities || project.activities.length === 0) {
                list.innerHTML = '<div class="empty-state"><p>还没有活动记录</p></div>';
            } else {
                list.innerHTML = project.activities.map((activity, index) => {
                    const imagesHtml = activity.images && activity.images.length > 0 
                        ? `<div class="activity-images">${activity.images.map(img => `<img src="${img}" onclick="viewImage('${img}')">`).join('')}</div>`
                        : '';
                    
                    const detailText = activity.type === 'avg' 
                        ? `人均：¥${(activity.totalAmount / activity.members.length).toFixed(2)}`
                        : activity.memberAmounts.map(ma => `${ma.member}：¥${ma.amount.toFixed(2)}`).join('，');
                    
                    return `
                        <div class="activity-item">
                            <div class="activity-layout">
                                <div class="activity-icon">${getActivityIcon(activity.name)}</div>
                                <div class="activity-content">
                                    <div class="activity-header">
                                        <div class="activity-name">${activity.name}</div>
                                        <div class="activity-amount">¥${activity.totalAmount.toFixed(2)}</div>
                                    </div>
                                    <div class="activity-detail">
                                        ${activity.members.join('、')} · ${activity.type === 'avg' ? '平均花费' : '不平均花费'}
                                    </div>
                                    <div class="activity-detail">${detailText}</div>
                                    ${imagesHtml}
                                    <div class="activity-actions">
                                        <button class="btn-edit" onclick="editActivity(${index})">${icon('edit')}编辑</button>
                                        <button class="btn-delete" onclick="deleteActivity(${index})">${icon('trash')}删除</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function renderSettlement(project) {
            const total = calculateTotal(project);
            const personTotals = calculatePersonTotals(project);
            
            const settlementHtml = `
                <div class="settlement">
                    <div class="settlement-title">${icon('diamond')} 项目结算</div>
                    <div class="settlement-total">总花费：¥${total.toFixed(2)}</div>
                    ${project.members.map(member => `
                        <div class="settlement-person">
                            <span class="settlement-person-name">${member}</span>
                            <span class="settlement-person-amount">¥${(personTotals[member] || 0).toFixed(2)}</span>
                        </div>
                    `).join('')}
                </div>
            `;
            
            document.getElementById('settlementArea').innerHTML = settlementHtml;
        }

        function calculateTotal(project) {
            return (project.activities || []).reduce((sum, activity) => sum + activity.totalAmount, 0);
        }

        function calculatePersonTotals(project) {
            const totals = {};
            project.members.forEach(m => totals[m] = 0);
            
            (project.activities || []).forEach(activity => {
                if (activity.type === 'avg') {
                    const perPerson = activity.totalAmount / activity.members.length;
                    activity.members.forEach(m => {
                        totals[m] += perPerson;
                    });
                } else {
                    activity.memberAmounts.forEach(ma => {
                        totals[ma.member] += ma.amount;
                    });
                }
            });
            
            return totals;
        }

        function showEditMembers() {
            const project = projects.find(p => p.id === currentProjectId);
            if (project) {
                document.getElementById('editMembersInput').value = project.members.join(',');
                document.getElementById('editMembersModal').style.display = 'flex';
            }
        }

        async function updateMembers() {
            const membersStr = document.getElementById('editMembersInput').value.trim();
            const members = membersStr.split(/[,，、\s]+/).filter(m => m);
            
            if (members.length < 2 || members.length > 10) {
                alert('成员数量需要在2-10人之间');
                return;
            }
            
            try {
                await db.collection('projects').doc(currentProjectId).update({
                    members: members
                });
                closeModal('editMembersModal');
            } catch (error) {
                alert('更新失败：' + error.message);
            }
        }

        function showAddActivity() {
            editingActivityId = null;
            document.getElementById('activityModalTitle').textContent = '添加活动';
            selectedMembers = [];
            currentActivityImages = [];
            
            document.getElementById('activityName').value = '';
            document.getElementById('totalAmount').value = '';
            document.getElementById('imageInput').value = '';
            selectType('avg');
            renderActivityMembers();
            renderCustomInputs();
            renderImageUploads();
            
            document.getElementById('addActivityModal').style.display = 'flex';
        }

        function editActivity(index) {
            const project = projects.find(p => p.id === currentProjectId);
            if (!project) return;
            
            const activity = project.activities[index];
            editingActivityId = index;
            document.getElementById('activityModalTitle').textContent = '编辑活动';
            
            document.getElementById('activityName').value = activity.name;
            selectedMembers = [...activity.members];
            currentActivityImages = [...(activity.images || [])];
            
            selectType(activity.type);
            
            if (activity.type === 'avg') {
                document.getElementById('totalAmount').value = activity.totalAmount;
            } else {
                renderCustomInputs();
                setTimeout(() => {
                    const inputs = document.querySelectorAll('.custom-amount');
                    inputs.forEach(input => {
                        const member = input.dataset.member;
                        const amount = activity.memberAmounts.find(ma => ma.member === member);
                        if (amount) {
                            input.value = amount.amount;
                        }
                    });
                }, 100);
            }
            
            renderActivityMembers();
            renderImageUploads();
            
            document.getElementById('addActivityModal').style.display = 'flex';
        }

        function selectType(type) {
            currentType = type;
            document.getElementById('typeAvg').className = 'radio-option' + (type === 'avg' ? ' active' : '');
            document.getElementById('typeCustom').className = 'radio-option' + (type === 'custom' ? ' active' : '');
            
            document.getElementById('avgInputArea').style.display = type === 'avg' ? 'block' : 'none';
            document.getElementById('customInputArea').style.display = type === 'custom' ? 'block' : 'none';
            
            renderCustomInputs();
        }

        function renderActivityMembers() {
            const project = projects.find(p => p.id === currentProjectId);
            if (!project) return;
            
            const container = document.getElementById('activityMembers');
            
            container.innerHTML = project.members.map(member => `
                <span class="member-tag ${selectedMembers.includes(member) ? 'selected' : ''}" 
                      onclick="toggleMember('${member}')">${member}</span>
            `).join('');
        }

        function toggleMember(member) {
            const index = selectedMembers.indexOf(member);
            if (index > -1) {
                selectedMembers.splice(index, 1);
            } else {
                selectedMembers.push(member);
            }
            renderActivityMembers();
            renderCustomInputs();
        }

        function renderCustomInputs() {
            const container = document.getElementById('customAmountInputs');
            
            if (currentType !== 'custom') {
                container.innerHTML = '';
                return;
            }
            
            container.innerHTML = selectedMembers.map(member => `
                <div class="input-group">
                    <label>${member}的花费（元）</label>
                    <input type="number" class="custom-amount" data-member="${member}" placeholder="0.00" step="0.01">
                </div>
            `).join('');
        }

        function handleImageUpload(event) {
            const files = event.target.files;
            
            for (let file of files) {
                if (currentActivityImages.length >= 3) {
                    alert('最多上传3张图片');
                    break;
                }
                
                compressImage(file, function(compressedDataUrl) {
                    currentActivityImages.push(compressedDataUrl);
                    renderImageUploads();
                });
            }
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let width = img.width;
                    let height = img.height;
                    const maxSize = 800;
                    
                    if (width > height && width > maxSize) {
                        height = height * (maxSize / width);
                        width = maxSize;
                    } else if (height > maxSize) {
                        width = width * (maxSize / height);
                        height = maxSize;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    callback(compressedDataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderImageUploads() {
            const container = document.getElementById('imageUploadArea');
            
            const imagesHtml = currentActivityImages.map((img, index) => `
                <div class="image-preview-wrapper">
                    <img src="${img}" class="image-preview">
                    <button class="image-remove" onclick="removeImage(${index})">✕</button>
                </div>
            `).join('');
            
            container.innerHTML = imagesHtml;
        }

        function removeImage(index) {
            currentActivityImages.splice(index, 1);
            renderImageUploads();
        }

        async function saveActivity() {
            const name = document.getElementById('activityName').value.trim();
            
            if (!name) {
                alert('请输入活动名称');
                return;
            }
            
            if (selectedMembers.length === 0) {
                alert('请选择参与成员');
                return;
            }
            
            let activity = {
                name: name,
                type: currentType,
                members: [...selectedMembers],
                images: [...currentActivityImages],
                totalAmount: 0,
                memberAmounts: []
            };
            
            if (currentType === 'avg') {
                const totalAmount = parseFloat(document.getElementById('totalAmount').value);
                if (!totalAmount || totalAmount <= 0) {
                    alert('请输入有效的总花费');
                    return;
                }
                activity.totalAmount = totalAmount;
            } else {
                const customInputs = document.querySelectorAll('.custom-amount');
                let totalAmount = 0;
                
                customInputs.forEach(input => {
                    const member = input.dataset.member;
                    const amount = parseFloat(input.value) || 0;
                    totalAmount += amount;
                    activity.memberAmounts.push({
                        member: member,
                        amount: amount
                    });
                });
                
                activity.totalAmount = totalAmount;
            }
            
            try {
                const projectRef = db.collection('projects').doc(currentProjectId);
                const project = projects.find(p => p.id === currentProjectId);
                let activities = [...(project.activities || [])];
                
                if (editingActivityId === null) {
                    activities.push(activity);
                } else {
                    activities[editingActivityId] = activity;
                }
                
                await projectRef.update({
                    activities: activities
                });
                
                closeModal('addActivityModal');
            } catch (error) {
                alert('保存失败：' + error.message);
            }
        }

        async function deleteActivity(index) {
            if (confirm('确定要删除这个活动吗？')) {
                try {
                    const project = projects.find(p => p.id === currentProjectId);
                    let activities = [...project.activities];
                    activities.splice(index, 1);
                    
                    await db.collection('projects').doc(currentProjectId).update({
                        activities: activities
                    });
                } catch (error) {
                    alert('删除失败：' + error.message);
                }
            }
        }

        async function deleteCurrentProject() {
            if (confirm('确定要删除整个项目吗？此操作不可恢复！')) {
                try {
                    await db.collection('projects').doc(currentProjectId).delete();
                    backToHome();
                } catch (error) {
                    alert('删除失败：' + error.message);
                }
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function viewImage(src) {
            window.open(src, '_blank');
        }

        init();
    </script>
</body>
</html>
